{% load static assets %}
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <script>document.documentElement.classList.add('js');</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Calculus Bridge{% endblock %}</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% asset 'css/style.css' %}">
  <link rel="stylesheet" href="{% asset 'css/practice.css' %}">
  <link rel="stylesheet" href="{% asset 'css/whiteboard.css' %}">
  {% block extra_css %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  <canvas id="confetti-canvas"></canvas>

  <div id="app">
    {% block content %}{% endblock %}
  </div>

  {% block app_js %}
  <script src="{% asset 'js/graphlab.js' %}"></script>
  <script src="{% asset 'js/whiteboard.js' %}"></script>
  <script src="{% asset 'js/app.js' %}"></script>
  <script src="{% asset 'js/practice.js' %}"></script>
  <script src="{% asset 'js/free_practice.js' %}"></script>
  {% endblock %}
  {% block extra_js %}{% endblock %}
</body>
</html>

{% comment %}
  Indikator langkah onboarding. Pemakaian:
  {% include 'auth/_steps.html' with step=2 %}
  1 = Akun, 2 = Fakultas, 3 = Tes awal, 4 = Beranda
{% endcomment %}
<ol class="auth-steps" aria-label="Langkah pendaftaran">
  <li class="{% if step > 1 %}done{% elif step == 1 %}current{% endif %}"><span>1</span>Akun</li>
  <li class="{% if step > 2 %}done{% elif step == 2 %}current{% endif %}"><span>2</span>Fakultas</li>
  <li class="{% if step > 3 %}done{% elif step == 3 %}current{% endif %}"><span>3</span>Tes awal</li>
  <li class="{% if step == 4 %}current{% endif %}"><span>4</span>Beranda</li>
</ol>

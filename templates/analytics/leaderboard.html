<!-- =========================================================================
     MODUL: Leaderboard  (Page: Rank)
     Gaya   : "Stratigrafi" — kertas & tinta, warna hanya untuk tier (static/css/leaderboard.css).
     Isi    : Papan Level (urut total XP), Rank Duel (tier · sub-rank · bintang, aturan di
              gamification/ranking.py), dan Menang Duel (urut jumlah kemenangan), masing-masing
              Seluruh Indonesia · kampusku · fakultasku; Rank juga Apex 100.
              Rank Duel: kolom Ketinggian (lapisan tier setebal jumlah pemainnya), kartu Posisimu,
              5 teratas → "Tampilkan N pemain" → pemain di sekitarmu; state seri bila semua 0–0.
              Diisi static/js/leaderboard.js dari /api/peringkat/.
     ========================================================================= -->

<div class="lbx">
  <header class="lbx-head">
    <div class="lbx-headline">
      <h2 class="lbx-title" id="lbx-title">Level</h2>
      <p class="lbx-sub" id="lbx-sub"></p>
    </div>
    <div class="lbx-seg" role="tablist" aria-label="Jenis peringkat">
      <button type="button" class="lb-tab active" role="tab" aria-selected="true" data-board="level">Level</button>
      <button type="button" class="lb-tab" role="tab" aria-selected="false" data-board="rank">Rank Duel</button>
      <button type="button" class="lb-tab" role="tab" aria-selected="false" data-board="wins">Menang Duel</button>
    </div>
  </header>

  <nav class="lbx-scopes" aria-label="Cakupan peringkat">
    <button type="button" class="lb-scope active" data-scope="global">Seluruh Indonesia</button>
    <button type="button" class="lb-scope" data-scope="kampus" id="lbx-scope-kampus">{% if server_profile.campus and server_profile.campus != "Umum" %}{{ server_profile.campus }}{% else %}Kampusku{% endif %}</button>
    <button type="button" class="lb-scope" data-scope="fakultas">{{ server_profile.faculty_short|default:"Fakultasku" }}</button>
    <button type="button" class="lb-scope" data-scope="apex" hidden>Apex 100</button>
  </nav>

  <div id="lb-root" aria-live="polite"><p class="lbx-loading">Memuat peringkat…</p></div>
</div>

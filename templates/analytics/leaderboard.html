{% load icons %}
<!-- =========================================================================
     MODUL: Leaderboard  (Page: Rank)
     Gaya   : sama dengan aplikasi (kartu membulat, bayangan halus, aksen azure, ikut mode terang/gelap),
              static/css/leaderboard.css.
     Isi    : Papan Level (urut total XP), Rank Duel (tier · sub-rank · bintang, aturan di
              gamification/ranking.py), dan Menang Duel (urut jumlah kemenangan), masing-masing
              Seluruh Indonesia · kampusku · fakultasku; Rank juga Apex 100.
              Kartu Posisimu → podium 3 teratas → daftar #4 dst ("Tampilkan N" → pemain di sekitarmu);
              Rank Duel juga kolom Ketinggian (lapisan tier); state seri bila semua 0–0.
              Diisi static/js/leaderboard.js dari /api/peringkat/.
     ========================================================================= -->

<div class="lbx">
  <header class="lbx-head">
    <div class="lbx-headline">
      <h2 class="page-heading">Leaderboard</h2>
      <p class="page-subheading" id="lbx-sub"></p>
    </div>
    <div class="lbx-seg" role="tablist" aria-label="Jenis leaderboard">
      <button type="button" class="lb-tab active" role="tab" aria-selected="true" data-board="level">{% icon "cap" %} Level</button>
      <button type="button" class="lb-tab" role="tab" aria-selected="false" data-board="rank">{% icon "swords" %} Rank Duel</button>
      <button type="button" class="lb-tab" role="tab" aria-selected="false" data-board="wins">{% icon "trophy" %} Menang Duel</button>
    </div>
  </header>

  <nav class="lbx-scopes" aria-label="Cakupan leaderboard">
    <button type="button" class="lb-scope active" data-scope="global">Seluruh Indonesia</button>
    <button type="button" class="lb-scope" data-scope="kampus" id="lbx-scope-kampus">{% if server_profile.campus and server_profile.campus != "Umum" %}{{ server_profile.campus }}{% else %}Kampusku{% endif %}</button>
    <button type="button" class="lb-scope" data-scope="fakultas">{{ server_profile.faculty_short|default:"Fakultasku" }}</button>
    <button type="button" class="lb-scope" data-scope="apex" hidden>Apex 100</button>
  </nav>

  <div id="lb-root" aria-live="polite"><p class="lbx-loading">Lagi nyiapin leaderboard…</p></div>
</div>
